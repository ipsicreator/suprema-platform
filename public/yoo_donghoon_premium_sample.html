<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>입학사정관 평가 시뮬레이션 (유동훈)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.15), transparent 30%);
      background-attachment: fixed;
      color: #f8fafc; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      height: 70px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem;
    }
    .brand { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .headerTitle { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .headerSubtitle { font-size: 0.8rem; color: #94a3b8; margin: 0; }
    .btnPrimary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 10px; font-weight: 600
        <div class="card">
          <div class="cardTitle">사정관 평가 의견</div>
          <textarea class="input" style="height: 120px; resize: none; margin-bottom: 1rem;">성실함과 발전 가능성을 두루 갖춘 인재로, 학종 진단 시 인서울 중위권 이상 대학에 안정적인 지원이 가능합니다.</textarea>
          <button class="btnPrimary" style="width: 100%;">로컬 저장</button>
        </div>
      </div>
    </aside>
  </main>
  <script>
    Chart.defaults.color = '#cbd5e1';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
    
    new Chart(document.getElementById('chart1'), {
      type: 'line',
      data: { labels: ['1-1','1-2','2-1','2-2','3-1'], datasets: [{ data: [2.6, 2.5, 2.4, 2.3, 2.35], borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)', fill: true, tension: 0.4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { reverse: true } } }
    });
    new Chart(document.getElementById('chart2'), {
      type: 'radar',
      data: { labels: ['학업','진로','탐구','공동체','발전','주도성'], datasets: [{ data: [95, 92, 88, 85, 90, 89], backgroundColor: 'rgba(139, 92, 246, 0.3)', borderColor: '#a78bfa' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { ticks: { display: false } } } }
    });
    new Chart(document.getElementById('chart3'), {
      type: 'bar',
      data: { labels: ['A','B','C'], datasets: [{ data: [8, 12, 0], backgroundColor: ['#34d399', '#fbbf24', '#f87171'], borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  </script>
</body>
</html>
